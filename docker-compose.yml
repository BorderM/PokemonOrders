services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      POKEMONORDERS_DB: /data/pokemonorders.db
      POKEMONORDERS_SECRET_KEY: change-me-in-production
      FLASK_ENV: development
    volumes:
      - pokemonorders-data:/data
      - ./uploads:/uploads

volumes:
  pokemonorders-data:
